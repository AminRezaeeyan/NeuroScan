name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, security, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -q -r src -c pyproject.toml

      - name: Notebooks have no outputs
        run: uv run nbstripout --verify notebooks/*.ipynb

      # Behavioral tests need the local MLflow registry and dataset; they skip here.
      - name: Pytest
        run: uv run pytest -m "not behavioral" -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Locally the image is built offline from the host's uv cache; CI has none, so it
      # passes an empty cache and lets uv download.
      - name: Build image
        run: |
          mkdir -p /tmp/empty-uv-cache
          docker buildx build \
            --build-context uvcache=/tmp/empty-uv-cache \
            --build-arg UV_OFFLINE=0 \
            --tag neuroscan-api:ci \
            --load .

      - name: Image runs as non-root and imports the API
        run: |
          test "$(docker run --rm neuroscan-api:ci id -u)" != "0"
          docker run --rm --entrypoint python neuroscan-api:ci -c \
            "import neuroscan.serving.schemas, neuroscan.serving.checks; print('ok')"
