# The champion's recipe, unchanged, with shortcut-reduced preprocessing: each image is
# cropped to the head and its intensity normalized (1st-99th percentile -> 0-255)
# before resizing. Only data.preprocessing differs from efficientnet_b0.yaml.
run_name: efficientnet-b0-shortcut-reduced
model:
  name: efficientnet_b0
  weights: imagenet
  dropout: 0.3
  fine_tune_from: block6a   # stage 2 trains blocks 6-7, top conv and head (~3.1M of 4.1M params)
data:
  image_size: 224
  batch_size: 32
  seed: 42
  preprocessing: shortcut_reduced
augment:
  flip: true
  rotation: 0.1
  zoom: 0.1
  brightness: 0.15
train:
  epochs: 40                   # both stages together
  head_epochs: 10              # stage 1, no early stopping
  learning_rate: 0.001         # stage 1
  fine_tune_lr_scale: 0.1      # stage 2 starts at 0.0001
  early_stopping_patience: 8   # stage 2, best weights restored
  lr_patience: 4
  lr_factor: 0.5
  min_lr: 0.000001
