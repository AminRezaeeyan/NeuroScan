[project]
name = "neuroscan"
version = "2.0.0.dev0"
description = "Brain tumor MRI classification with tracked experiments, calibration and OOD rejection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amin Rezaeeyan" }]
requires-python = ">=3.10"
dependencies = [
    # Range instead of a pin so Colab can keep its preinstalled TensorFlow.
    "tensorflow>=2.18,<2.21",
    "numpy>=1.26",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "imagehash>=4.3",
    "kaggle>=1.7",
]

[project.optional-dependencies]
# Local-only: Colab never talks to MLflow.
tracking = ["mlflow>=2.20"]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "gunicorn>=23.0",
    "python-multipart>=0.0.18",
    "flask>=3.1",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
    "bandit>=1.8",
    "types-PyYAML",
    "pandas-stubs",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroscan"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:`shuffle=True` was passed:UserWarning",
]
markers = [
    "slow: builds full-size models or touches the network",
    "behavioral: runs against the registered champion model",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
